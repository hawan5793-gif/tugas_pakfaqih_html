<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tabel Absensi</title>
  <style>
    body { font-family: "Times New Roman", serif; margin: 40px; }
    table { border-collapse: collapse; margin: auto; font-size: 18px; }
    th, td { border: 1px solid #333; padding: 6px 12px; text-align: center; }
    th { font-weight: bold; }
    td.nama { text-align: left; }
  </style>
</head>
<body>
  <table>
    <tr>
      <th rowspan="3">NIS</th>
      <th rowspan="3">Nama</th>
      <th colspan="9">Bulan</th>
    </tr>
    <tr>
      <th colspan="3">Januari</th>
      <th colspan="3">Februari</th>
      <th colspan="3">Maret</th>
    </tr>
    <tr>
      <th>S</th><th>I</th><th>A</th>
      <th>S</th><th>I</th><th>A</th>
      <th>S</th><th>I</th><th>A</th>
    </tr>
    <tr>
      <td>111</td>
      <td class="nama">muhammad akbar</td>
      <td>0</td><td>2</td><td>0</td>
      <td>0</td><td>0</td><td>0</td>
      <td>0</td><td>1</td><td>0</td>
    </tr>
    <tr>
      <td>112</td>
      <td class="nama">rifky aditya</td>
      <td>10</td><td>2</td><td>3</td>
      <td>21</td><td>9</td><td>0</td>
      <td>20</td><td>30</td><td>2</td>
    </tr>
  </table>
</body>
</html>
